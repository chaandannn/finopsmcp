name: Publish nable shim (PyPI)

# The `nable` package on PyPI is a metadata-only brand alias for finops-mcp
# (see shim/pyproject.toml). It changes rarely, only when its Python floor or
# dependency floor moves, so it publishes on its own tag.
#
# ONE-TIME HUMAN STEP before the first CI publish: on pypi.org, project `nable`
# -> Settings -> Publishing -> add a trusted publisher for this repo
# (getnable/finopsmcp, workflow publish-shim.yml, environment blank).
# Until that click happens, publish manually from shim/ with:  uv publish
on:
  push:
    tags:
      - "shim-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish shim to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine
      - name: Build distributions
        run: python -m build shim/ --outdir shim/dist/
      - name: Check distributions
        run: twine check shim/dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        # NOTE: this must be the COMMIT sha, not the annotated tag object's.
        # The action runs as a Docker image tagged by commit, so pinning the
        # tag object gave `manifest unknown` on a 404. `gh api .../git/ref/
        # tags/X` returns object.type="tag" for an annotated tag and must be
        # dereferenced; `gh api .../commits/vX.Y.Z --jq .sha` gives it directly.
        # Pinned by SHA, not tag, and bumped deliberately: the previous pin
        # bundled twine 6.1.0, which rejects Metadata-Version 2.5 with
        # "not a valid metadata version". hatchling emits 2.5 now, so
        # v0.8.211 built fine and failed at upload. v1.14.2 ships twine
        # 7.0.0; verified locally that 6.1.0 fails and 7.0.0 passes on the
        # identical wheel, rather than assuming a newer pin would help.
        with:
          packages-dir: shim/dist/
          skip-existing: true
