version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The <2 cap on mcp is deliberate: 2.0.0 removed mcp.server.fastmcp and
      # the server does not start (see 0.8.197). CI proves it on every widen
      # attempt (PR #69). Raising the cap is a migration, not a version bump.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
