[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `nable` is a thin brand alias for the `finops-mcp` package. It ships no code of
# its own: it just depends on finops-mcp and exposes a `nable` console script that
# points at the same smart entry point, so `uvx nable` works exactly like
# `uvx finops-mcp`.
#
# 0.1.1 fixes a silent-staleness trap that 0.1.0 shipped: it allowed Python 3.10,
# but finops-mcp 0.8.90+ requires 3.11, so on any machine where uv picked a 3.10
# interpreter the resolver quietly served finops-mcp 0.8.89 forever, a five-week-
# old product with none of the current onboarding. requires-python >= 3.11 makes
# uv select or download a modern interpreter instead, and the dependency floor
# guarantees no resolver can reach back past the fix.
#
# 0.1.3 REVERSES the floor, on purpose. Raising requires-python to 3.11 in 0.1.1
# did not close the staleness trap, it created a worse one: on a 3.10 interpreter
# 0.1.1 and 0.1.2 both excluded themselves, leaving 0.1.0 as the only installable
# version. `uvx nable` there resolved to finops-mcp 0.8.87 — no scan command, no
# entry dispatcher, and an mcp pin that raised ModuleNotFoundError on import. The
# user got a traceback and we got no telemetry, because it died before our code
# ran. Measured 2026-08-05: 0.1.0 + finops-mcp 0.8.87 on a stock 3.10.
#
# So the floor goes DOWN to 3.9, the engine dependency moves behind a
# python_version marker, and nable_shim.py does the check at runtime. Now the
# newest version is installable everywhere, always wins resolution, and an old
# interpreter gets one actionable line instead of a stack trace.
#
# 0.1.2 shipped the CLI front door: the entry point repoints to the light
# dispatcher (finops.entry:main) so `uvx nable scan` prints in under 2s instead
# of paying the ~0.9s server import first, and the floor rises to the first
# release that has finops/entry.py + the scan subcommand. Without the floor
# bump, cached uv environments resolve an old finops-mcp with no `scan` at
# all: the same staleness trap 0.1.1 fixed, one layer up.
[project]
name = "nable"
version = "0.1.6"
description = "Ask Claude about your cloud and AI bill. Brand alias for finops-mcp."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Chandan Bukkapatnam", email = "chandan@nable.sh" }]
keywords = ["finops", "mcp", "aws", "azure", "gcp", "cloud cost", "claude", "cursor"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = ["finops-mcp>=0.8.181; python_version >= '3.11'"]

[project.urls]
Homepage = "https://getnable.com"
Documentation = "https://getnable.com/docs"
Repository = "https://github.com/getnable/finopsmcp"

[project.scripts]
nable = "nable_shim:main"

[tool.hatch.build.targets.wheel]
# 0.1.3 ships one real module: the version check has to run somewhere, and it
# has to run on interpreters too old to install finops-mcp at all.
include = ["nable_shim.py"]
